# main の CI が通ったら API をデプロイする。dev は作られていればそのまま、prod は Environment の
# 承認を待ってから入れる。
#
# 手動で実行すると、ECR に入っている過去のイメージに戻す（ロールバック）。マイグレーションは
# 戻さない。理由は ADR-0034。
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 戻す環境
        type: choice
        options: [dev, prod]
        required: true
      image_tag:
        description: 戻す先のイメージのタグ（コミットの SHA。git rev-parse で 40 文字にする）
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: イメージのビルド
    # フォークからの pull request の CI も head_branch が main になりうるため、main への push に限る。
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      # Go はビルド用のステージでクロスコンパイルするため、QEMU は要らない。
      # dev と prod に同じイメージを入れるよう、1 回だけビルドして成果物で渡す。
      - name: ビルドする
        run: |
          docker buildx build --platform linux/arm64 --provenance=false \
            -f docker/api.release.Dockerfile \
            -t "anontopic-api:${{ github.event.workflow_run.head_sha }}" \
            --output type=docker,dest=api-image.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: api-image
          path: api-image.tar
          retention-days: 7

  dev:
    needs: build
    uses: ./.github/workflows/deploy-environment.yml
    secrets: inherit
    with:
      environment: dev
      ref: ${{ needs.build.outputs.sha }}
      image_tag: ${{ needs.build.outputs.sha }}
      push_image: true
      migrate: true
      skip_if_absent: true

  # dev が作られていればそこで通ってから、prod の承認を待つ。
  prod:
    needs: [build, dev]
    uses: ./.github/workflows/deploy-environment.yml
    secrets: inherit
    with:
      environment: prod
      ref: ${{ needs.build.outputs.sha }}
      image_tag: ${{ needs.build.outputs.sha }}
      push_image: true
      migrate: true

  rollback:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-environment.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ github.sha }}
      image_tag: ${{ inputs.image_tag }}
