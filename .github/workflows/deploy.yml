# main の CI が通ったら API とフロントエンドをデプロイする。dev は作られていればそのまま、prod は
# Environment の承認を待ってから入れる。
#
# 手動で実行すると、API とフロントエンドを ECR に入っている過去のイメージに戻す（ロールバック）。
# マイグレーションは戻さない。理由は ADR-0034。
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 戻す環境
        type: choice
        options: [dev, prod]
        required: true
      image_tag:
        description: 戻す先のイメージのタグ（コミットの SHA。git rev-parse で 40 文字にする）
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: イメージのビルド
    # フォークからの pull request の CI も head_branch が main になりうるため、main への push に限る。
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      # Go はビルド用のステージでクロスコンパイルするため、QEMU は要らない。
      # dev と prod に同じイメージを入れるよう、1 回だけビルドして成果物で渡す。
      - name: ビルドする
        run: |
          docker buildx build --platform linux/arm64 --provenance=false \
            -f docker/api.release.Dockerfile \
            -t "anontopic-api:${{ github.event.workflow_run.head_sha }}" \
            --output type=docker,dest=api-image.tar .
      - uses: actions/upload-artifact@v4
        with:
          name: api-image
          path: api-image.tar
          retention-days: 7

  # NEXT_PUBLIC_ で始まる値はビルドのときに埋め込まれるため、フロントエンドは環境ごとにビルドする
  # （ADR-0035）。ドメインが未登録のときはフロントエンドの環境も無いため、ビルドしない。
  build-web:
    name: フロントエンドのイメージのビルド (${{ matrix.env }})
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        env: [dev, prod]
    env:
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
    steps:
      - name: ドメインが登録されているか確かめる
        if: env.DOMAIN_NAME == ''
        run: echo "::notice::変数 DOMAIN_NAME が未登録のため、フロントエンドのビルドを飛ばした。"
      - uses: actions/checkout@v4
        if: env.DOMAIN_NAME != ''
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
        if: env.DOMAIN_NAME != ''
      # Next.js はビルド用のステージで動かし、実行用のステージはファイルを写すだけのため、QEMU は要らない。
      # サイトは prod が <ドメイン>、dev が dev.<ドメイン> で、API はそれぞれの頭に api. を付けたもの。
      - name: ビルドする
        if: env.DOMAIN_NAME != ''
        run: |
          site_host="$DOMAIN_NAME"
          if [ "${{ matrix.env }}" = dev ]; then
            site_host="dev.$DOMAIN_NAME"
          fi
          docker buildx build --platform linux/arm64 --provenance=false \
            --build-arg "NEXT_PUBLIC_SITE_URL=https://$site_host" \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=https://api.$site_host" \
            -f docker/web.release.Dockerfile \
            -t "anontopic-web:${{ github.event.workflow_run.head_sha }}" \
            --output type=docker,dest=web-image.tar .
      - uses: actions/upload-artifact@v4
        if: env.DOMAIN_NAME != ''
        with:
          name: web-image-${{ matrix.env }}
          path: web-image.tar
          retention-days: 1

  dev:
    needs: [build, build-web]
    uses: ./.github/workflows/deploy-environment.yml
    secrets: inherit
    with:
      environment: dev
      ref: ${{ needs.build.outputs.sha }}
      image_tag: ${{ needs.build.outputs.sha }}
      push_image: true
      migrate: true
      skip_if_absent: true

  # dev が作られていればそこで通ってから、prod の承認を待つ。
  prod:
    needs: [build, build-web, dev]
    uses: ./.github/workflows/deploy-environment.yml
    secrets: inherit
    with:
      environment: prod
      ref: ${{ needs.build.outputs.sha }}
      image_tag: ${{ needs.build.outputs.sha }}
      push_image: true
      migrate: true

  rollback:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-environment.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      ref: ${{ github.sha }}
      image_tag: ${{ inputs.image_tag }}
