name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.15.8"

jobs:
  backend-lint:
    name: バックエンド lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # バージョンの定義は Makefile 側にある。CI とローカルで食い違わないようにする。
      - name: golangci-lint を入れる
        run: make tools TOOLS=golangci-lint
      - run: go vet ./...
      - run: make backend-lint

  backend-test:
    name: バックエンド test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: anontopic
          POSTGRES_PASSWORD: anontopic
          POSTGRES_DB: anontopic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anontopic -d anontopic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make backend-build
      - run: make backend-test
      # 空のデータベースにスキーマと初期データを流せることを確かめる。
      # 接続先は Makefile の既定値（localhost:5432）がそのまま使える。
      - name: マイグレーションとシードを空の DB に適用する
        run: |
          make migrate
          make seed
      # シードには保持期間を過ぎた会話が入っているため、削除と退避の両方の経路を通る。
      - name: 保持期間バッチを流せることを確かめる
        run: |
          make retention-dry-run
          make retention
      - name: 巻き戻せることを確かめる
        run: go run ./cmd/migrate down

  frontend-lint:
    name: フロントエンド lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  frontend-test:
    name: フロントエンド test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build

  infra-check:
    name: インフラ fmt / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: make infra-check

  infra-plan:
    name: インフラ plan (${{ matrix.env }})
    needs: infra-check
    # フォークからの pull request には OIDC のトークンもシークレットも渡らない。
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/environments/${{ matrix.env }}
    # アカウント ID・バケット名・通知先のメールアドレスはシークレットに置き、ログ上では伏せ字にする。
    # ドメインは変数に置く。未登録のときは空文字になり、証明書・DNS レコード・HTTPS リスナーを作らない plan になる。
    env:
      TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/anontopic-terraform-plan
          aws-region: ap-northeast-1
      - run: terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET"
      # 公開リポジトリの Actions のログは誰でも読める。差分の中身は出さず、件数の行だけを出す。
      # 中身はローカルの make infra-plan で確かめる。
      - name: terraform plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=60s > plan.txt
          grep -E '^(Plan:|No changes\.)' plan.txt
