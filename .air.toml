# Hot reload configuration used by the api service in compose.yaml.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  include_ext = ["go"]
  exclude_dir = ["tmp", "web", "infra", "db", "test", ".git"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true

[log]
  time = true
