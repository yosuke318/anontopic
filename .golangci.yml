version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
  exclusions:
    presets:
      - std-error-handling
    paths:
      # Vendored Go sources shipped inside npm packages are not ours.
      - web/node_modules
    rules:
      - path: _test\.go$
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yosuke318/anontopic
  exclusions:
    paths:
      - web/node_modules

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
